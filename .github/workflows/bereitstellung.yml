name: Prüfung und Bereitstellung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smartdocs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Anwendung vollständig prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python-Dateien prüfen
        run: python -m compileall app scripts
      - name: A+ Solution Designsystem prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          editorial = Path("app/static/editorial-system.css").read_text(encoding="utf-8")
          marke = Path("app/static/app-aplus.css").read_text(encoding="utf-8")
          basis = Path("app/templates/base.html").read_text(encoding="utf-8")
          start = Path("app/templates/start.html").read_text(encoding="utf-8")
          assert editorial.count("{") == editorial.count("}"), "Das Editorial-Stylesheet enthält einen nicht geschlossenen Regelblock."
          assert marke.count("{") == marke.count("}"), "Der A+ Markenlayer enthält einen nicht geschlossenen Regelblock."
          assert "editorial-system.css" in basis, "Das Editorial-Grundsystem ist nicht eingebunden."
          assert "app-aplus.css" in basis, "Der A+ Solution Markenlayer ist nicht eingebunden."
          assert "#071c2e" in marke and "--aplus-sky" in marke, "Die dunkelblaue A+ Markenpalette fehlt."
          assert "#ff5a1f" not in marke and "#7658EF" not in marke, "Alte orange oder violette Akzentfarben sind im Markenlayer aktiv."
          assert "app-v2.css" not in basis and "app-typography.css" not in basis, "Alte Designsysteme sind noch aktiv."
          assert "IBM+Plex" in basis, "Die Produkttypografie ist nicht eingebunden."
          assert len(editorial) > 30000, "Das vollständige Grundsystem fehlt."
          assert len(marke) > 10000, "Der vollständige A+ Markenlayer fehlt."
          assert "Aus Ihrem Muster wird" in start, "Die neue Startseitenkonzeption fehlt."
          print("A+ Solution Designsystem ist vollständig, eingebunden und strukturell ausgeglichen.")
          PY
      - name: Produktabläufe prüfen
        run: python scripts/pruefung.py
      - name: Container-Konfiguration prüfen
        run: |
          cp .env.example .env
          docker compose config
        env:
          POSTGRES_DB: smartdocs
          POSTGRES_USER: smartdocs
          POSTGRES_PASSWORD: pruefwert
          DOMAIN: smartdocs.aplus-solution.de
          DATABASE_URL: postgresql+psycopg://smartdocs:pruefwert@datenbank:5432/smartdocs

  bereitstellen:
    name: Vorführsystem aktualisieren
    if: github.event_name != 'pull_request' || github.head_ref == 'release/vorfuehrung'
    needs: pruefen
    runs-on: ubuntu-latest
    environment: produktiv
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAIAPI }}
      BEREITSTELLUNGSZWEIG: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Über SSH bereitstellen
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: OPENAI_API_KEY,BEREITSTELLUNGSZWEIG
          script_stop: true
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl git openssl python3

            if ! command -v docker >/dev/null 2>&1; then
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              chmod a+r /etc/apt/keyrings/docker.asc
              . /etc/os-release
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
              apt-get update
              apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            mkdir -p /opt/a-smartdocs
            if [ ! -d /opt/a-smartdocs/.git ]; then
              git clone --branch "$BEREITSTELLUNGSZWEIG" https://github.com/hsdarestani/A-SmartDocs.git /opt/a-smartdocs
            else
              git -C /opt/a-smartdocs fetch origin "$BEREITSTELLUNGSZWEIG"
              git -C /opt/a-smartdocs checkout -B "$BEREITSTELLUNGSZWEIG" "origin/$BEREITSTELLUNGSZWEIG"
              git -C /opt/a-smartdocs reset --hard "origin/$BEREITSTELLUNGSZWEIG"
            fi

            cd /opt/a-smartdocs
            if [ ! -f .env ]; then
              DATENBANK_PASSWORT=$(openssl rand -hex 24)
              APP_GEHEIMNIS=$(openssl rand -hex 32)
              cat > .env <<UMGEBUNG
            DOMAIN=smartdocs.aplus-solution.de
            POSTGRES_DB=smartdocs
            POSTGRES_USER=smartdocs
            POSTGRES_PASSWORD=${DATENBANK_PASSWORT}
            DATABASE_URL=postgresql+psycopg://smartdocs:${DATENBANK_PASSWORT}@datenbank:5432/smartdocs
            APP_SECRET=${APP_GEHEIMNIS}
            OPENAI_MODEL=gpt-4.1-mini
            MAX_UPLOAD_MB=20
            UMGEBUNG
            fi

            python3 - <<'PY'
            from pathlib import Path
            import os
            pfad = Path('.env')
            zeilen = pfad.read_text().splitlines()
            schluessel = 'OPENAI_API_KEY'
            wert = os.environ.get(schluessel, '')
            neu = []
            gefunden = False
            for zeile in zeilen:
                if zeile.startswith(schluessel + '='):
                    neu.append(f'{schluessel}={wert}')
                    gefunden = True
                else:
                    neu.append(zeile)
            if not gefunden:
                neu.append(f'{schluessel}={wert}')
            pfad.write_text('\n'.join(neu) + '\n')
            PY

            docker compose pull
            docker compose up -d --build --remove-orphans
            docker image prune -f
            sleep 10
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1/api/status >/dev/null

      - name: Öffentliche Vorführadresse prüfen
        run: |
          for versuch in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://smartdocs.aplus-solution.de/api/status; then
              exit 0
            fi
            sleep 10
          done
          exit 1
