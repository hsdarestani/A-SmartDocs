name: Präsentationsfassung anwenden

on:
  push:
    branches: [ausbau/vollstaendige-praesentation]
    paths:
      - "tools/presentation-update/**"
      - ".github/workflows/apply-presentation-update.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/presentation-update/**"
      - ".github/workflows/apply-presentation-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartdocs-praesentationsfassung
  cancel-in-progress: false

jobs:
  anwenden:
    name: Vollständigen Produktstand einspielen
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Präsentationsfassung zusammensetzen und speichern
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --branch ausbau/vollstaendige-praesentation "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" arbeitskopie
          cd arbeitskopie
          cat tools/presentation-update/part-*.b64 > /tmp/smartdocs-update.b64
          base64 --decode /tmp/smartdocs-update.b64 > /tmp/smartdocs-update.tar.gz
          echo "06e38ae09796a5ecc57e31cf587a64d7aadd26bac3020d06a8649d15e72b334a  /tmp/smartdocs-update.tar.gz" | sha256sum --check -
          tar -xzf /tmp/smartdocs-update.tar.gz
          find app -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf tools/presentation-update
          git checkout HEAD -- .github/workflows/bereitstellung.yml
          git config user.name "A+ SmartDocs Automatisierung"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Vollständige Präsentationsfassung umsetzen"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:generated/vollstaendige-praesentation
