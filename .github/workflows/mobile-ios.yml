name: SmartDocs iOS → TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: macos-latest
    env:
      SMARTDOCS_APP_URL: ${{ vars.SMARTDOCS_APP_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Quelltext laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Store-Konfiguration prüfen
        shell: bash
        run: |
          set -euo pipefail
          for name in SMARTDOCS_APP_URL APPLE_TEAM_ID IOS_DISTRIBUTION_CERT_P12_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then echo "Fehlende Actions-Konfiguration: $name" >&2; exit 1; fi
          done

      - name: Capacitor iOS erzeugen
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          node scripts/configure-native.mjs ios
          npx cap sync ios
          node scripts/configure-native.mjs ios

      - name: Privacy Manifest dem App-Target hinzufügen
        working-directory: mobile
        shell: bash
        run: |
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          raise 'App target fehlt' unless target
          group = project.main_group.find_subpath('App', true)
          ref = group.files.find { |f| f.path == 'PrivacyInfo.xcprivacy' } || group.new_file('PrivacyInfo.xcprivacy')
          unless target.resources_build_phase.files_references.include?(ref)
            target.resources_build_phase.add_file_reference(ref, true)
          end
          project.save
          RUBY

      - name: Apple Distribution Zertifikat importieren
        shell: bash
        run: |
          set -euo pipefail
          RAW_P12="$RUNNER_TEMP/distribution-input.p12"
          PEM="$RUNNER_TEMP/distribution.pem"
          COMPAT_P12="$RUNNER_TEMP/distribution-compatible.p12"
          KEYCHAIN="$RUNNER_TEMP/smartdocs-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RAW_P12"
          test -s "$RAW_P12" || { echo "Das Distribution-P12 ist leer oder Base64 ist ungültig." >&2; exit 1; }

          echo "Prüfe PKCS#12 und Passwort ..."
          if ! openssl pkcs12 \
              -in "$RAW_P12" \
              -passin env:IOS_DISTRIBUTION_CERT_PASSWORD \
              -nodes \
              -out "$PEM"; then
            echo "Das P12 konnte nicht mit IOS_DISTRIBUTION_CERT_PASSWORD geöffnet werden. Bitte P12 und Passwort als zusammengehöriges Paar in GitHub Secrets aktualisieren." >&2
            exit 1
          fi

          echo "Erzeuge ein macOS-Keychain-kompatibles PKCS#12 ..."
          if ! openssl pkcs12 \
              -export \
              -in "$PEM" \
              -out "$COMPAT_P12" \
              -name "Apple Distribution: A+ Solution GmbH" \
              -passout env:IOS_DISTRIBUTION_CERT_PASSWORD \
              -legacy; then
            echo "Legacy-Modus nicht verfügbar; versuche explizite Apple-kompatible Algorithmen ..."
            openssl pkcs12 \
              -export \
              -in "$PEM" \
              -out "$COMPAT_P12" \
              -name "Apple Distribution: A+ Solution GmbH" \
              -passout env:IOS_DISTRIBUTION_CERT_PASSWORD \
              -keypbe PBE-SHA1-3DES \
              -certpbe PBE-SHA1-3DES \
              -macalg sha1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$COMPAT_P12" \
            -k "$KEYCHAIN" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Provisioning Profile installieren
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/smartdocs.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$APP_IDENTIFIER" in *de.aplussolution.smartdocs) ;; *) echo "Provisioning Profile gehört nicht zu de.aplussolution.smartdocs: $APP_IDENTIFIER" >&2; exit 1;; esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: App archivieren
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Baue über Xcode Workspace."
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "Baue über Xcode Project (Capacitor 8 / Swift Package Manager)."
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          else
            echo "Weder ios/App/App.xcworkspace noch ios/App/App.xcodeproj wurde erzeugt." >&2
            find ios -maxdepth 4 -print || true
            exit 1
          fi

          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmartDocs.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="de.aplussolution.smartdocs" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="1.0" \
            archive

      - name: IPA exportieren
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>de.aplussolution.smartdocs</key><string>${{ steps.profile.outputs.name }}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmartDocs.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: IPA als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: smartdocs-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: App Store Connect API-Key vorbereiten
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Zu TestFlight hochladen
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
