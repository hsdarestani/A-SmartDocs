name: SmartDocs Android → Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      SMARTDOCS_APP_URL: ${{ vars.SMARTDOCS_APP_URL || secrets.SMARTDOCS_APP_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - name: Quelltext laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Store-Konfiguration prüfen
        shell: bash
        run: |
          set -euo pipefail
          for name in SMARTDOCS_APP_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64; do
            if [ -z "${!name:-}" ]; then echo "Fehlende Actions-Konfiguration: $name" >&2; exit 1; fi
          done
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Capacitor Android erzeugen
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/configure-native.mjs android
          npx cap sync android
          node scripts/configure-native.mjs android

      - name: Release-Signatur einrichten
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/smartdocs-upload.jks
          chmod 600 app/smartdocs-upload.jks
          cat > keystore.properties <<EOF
          storeFile=app/smartdocs-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.'"${GITHUB_RUN_NUMBER}"'"/' app/build.gradle

      - name: Signiertes AAB bauen
        working-directory: mobile/android
        run: ./gradlew --no-daemon clean bundleRelease

      - name: Build-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: smartdocs-android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Google-Play-Schlüssel vorbereiten
        shell: bash
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-play.json"
          chmod 600 "$RUNNER_TEMP/google-play.json"

      - name: In Google Play Internal Testing veröffentlichen
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play.json
          packageName: de.aplussolution.smartdocs
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
